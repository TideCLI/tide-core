name: Auto-rebase Dependabot PRs

on:
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  rebase:
    name: Rebase open Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - name: Comment @dependabot rebase on open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --author "app/dependabot" --state open --json number \
            --jq '.[].number' | while read -r pr; do
            echo "Rebasing PR #$pr"
            gh pr comment "$pr" --body "@dependabot rebase" || true
          done
