name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate: only release if CI passes
  ci-check:
    name: CI Check
    uses: ./.github/workflows/ci.yml

  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: ci-check
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected, releasing v${{ steps.version.outputs.version }}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag
        if: steps.check_tag.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.should_release == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native bindings
        run: bun run build:native

      - name: Build binary
        run: bun --cwd=packages/coding-agent run build:binary

      - uses: actions/upload-artifact@v4
        with:
          name: omp-linux-x64
          path: packages/coding-agent/dist/omp

  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debootstrap squashfs-tools xorriso \
            isolinux syslinux-common grub-efi-amd64-bin grub-common mtools rsync

      - name: Build ISO
        run: sudo bash scripts/build-iso.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tide-os-iso
          path: .build/iso/tide-os.iso
          compression-level: 0

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release, build-binary, build-iso]
    if: needs.release.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/omp-linux-x64/omp release/omp-linux-x64
          chmod +x release/omp-linux-x64
          cp artifacts/tide-os-iso/tide-os.iso release/tide-os-${{ needs.release.outputs.tag }}.iso
          cd release && sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: "Tide OS ${{ needs.release.outputs.tag }}"
          generate_release_notes: true
          prerelease: true
          files: |
            release/omp-linux-x64
            release/tide-os-${{ needs.release.outputs.tag }}.iso
            release/SHA256SUMS
