name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binary:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: omp-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: omp-darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: omp-darwin-x64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native bindings
        run: bun run build:native

      - name: Build binary
        run: bun --cwd=packages/coding-agent run build:binary

      - name: Rename artifact
        run: mv packages/coding-agent/dist/omp packages/coding-agent/dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/coding-agent/dist/${{ matrix.artifact }}

  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debootstrap squashfs-tools xorriso \
            isolinux syslinux-common grub-efi-amd64-bin grub-common mtools rsync

      - name: Build ISO
        run: sudo bash scripts/build-iso.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tide-os-iso
          path: .build/iso/tide-os.iso
          compression-level: 0

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binary, build-iso]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Binaries
          cp artifacts/omp-linux-x64/omp-linux-x64 release/
          cp artifacts/omp-darwin-arm64/omp-darwin-arm64 release/
          cp artifacts/omp-darwin-x64/omp-darwin-x64 release/
          chmod +x release/omp-*
          # ISO
          cp artifacts/tide-os-iso/tide-os.iso release/tide-os-${{ github.ref_name }}.iso
          # Checksums
          cd release && sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/omp-linux-x64
            release/omp-darwin-arm64
            release/omp-darwin-x64
            release/tide-os-${{ github.ref_name }}.iso
            release/SHA256SUMS
