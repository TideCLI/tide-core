[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tide-os"
version = "3.0.0"
description = "Professional AI Coding Agent - inspired by charmbracelet/crush"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Tide Team"}
]
keywords = ["ai", "coding", "assistant", "ollama", "llm", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Environment :: Console",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "textual>=0.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
tide = "tide.cli:main"

[project.urls]
Homepage = "https://github.com/tide-os/tide"
Repository = "https://github.com/tide-os/tide"

[tool.hatch.build.targets.wheel]
packages = ["tide"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
